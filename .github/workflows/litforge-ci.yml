name: litforge-ci

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  litforge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v || python -m unittest discover -s tests -v

      - name: Verify engine integrity
        run: |
          python tools/lf_integrity.py verify

      - name: Run LitForge lint
        run: |
          python tools/lf_lint.py .

      - name: Run LitForge replay (moat chain)
        run: |
          python tools/lf_replay.py "Projects/EXAMPLE - Tiny Loop Demo"
